[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "helprange"
dynamic = ["version"]
description = "Official HelpRange API client: upload documents, create tracked share links, run data rooms, e-signature, offers and analytics."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HelpRange", email = "hello@helprange.com" }]
requires-python = ">=3.9"
dependencies = ["httpx>=0.23,<1"]
keywords = ["helprange", "api", "sdk", "document sharing", "data room", "virtual data room", "e-signature", "webhooks"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.8"]

[project.urls]
Homepage = "https://www.helprange.com/developers"
Documentation = "https://www.helprange.com/developers/api"
Repository = "https://github.com/HelpRange/helprange-python"
Issues = "https://github.com/HelpRange/helprange-python/issues"
Changelog = "https://github.com/HelpRange/helprange-python/blob/main/CHANGELOG.md"

[project.scripts]
helprange = "helprange.cli:main"

[tool.hatch.version]
path = "src/helprange/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/helprange"]

[tool.hatch.build.targets.sdist]
include = ["src/helprange", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["src/helprange/_generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = false
